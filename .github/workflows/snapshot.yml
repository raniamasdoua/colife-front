name: Snapshot Front

on:
  push:
    branches:
      - develop

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Tests
        run: npm run test -- --coverage

      - run: npm run build

      - run: zip -r snapshot.zip dist

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-build
          path: snapshot.zip